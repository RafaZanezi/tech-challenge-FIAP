apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: workshop-app

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - network-policy.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: workshop-app
  app.kubernetes.io/instance: workshop-app-prod
  app.kubernetes.io/version: "1.0.0"
  app.kubernetes.io/component: backend
  app.kubernetes.io/part-of: workshop-system

images:
  - name: workshop-app
    newName: tech-challenge-app
    newTag: latest

replicas:
  - name: workshop-app-deployment
    count: 3