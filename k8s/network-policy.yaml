apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: workshop-app-network-policy
  namespace: workshop-app
spec:
  podSelector:
    matchLabels:
      app: workshop-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow traffic from other pods in the same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: workshop-app
    ports:
    - protocol: TCP
      port: 3000
  # Allow traffic from ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow connection to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow outbound HTTPS for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: workshop-app
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
  ingress:
  # Only allow traffic from workshop-app pods
  - from:
    - podSelector:
        matchLabels:
          app: workshop-app
    ports:
    - protocol: TCP
      port: 5432