apiVersion: v1
kind: Service
metadata:
  name: workshop-app-service
  namespace: workshop-app
  labels:
    app: workshop-app
spec:
  selector:
    app: workshop-app
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: ClusterIP
---
# LoadBalancer service for external access (optional)
apiVersion: v1
kind: Service
metadata:
  name: workshop-app-loadbalancer
  namespace: workshop-app
  labels:
    app: workshop-app
spec:
  selector:
    app: workshop-app
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  type: LoadBalancer