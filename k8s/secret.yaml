apiVersion: v1
kind: Secret
metadata:
  name: workshop-app-secrets
  namespace: workshop-app
type: Opaque
data:
  # Base64 encoded values - replace with your actual encoded secrets
  # To encode: echo -n "your-secret-value" | base64
  
  # Database URL with credentials (postgres:admin@postgres-service:5432/workshop_db)
  DATABASE_URL: cG9zdGdyZXNxbDovL3Bvc3RncmVzOmFkbWluQHBvc3RncmVzLXNlcnZpY2U6NTQzMi93b3Jrc2hvcF9kYg==
  
  # JWT Secret for authentication
  JWT_SECRET: bXktand0LXNlY3JldC1rZXktZm9yLXdvcmtzaG9wLWFwcA==
  
  # Database credentials (postgres/admin to match workflow)
  DB_USER: cG9zdGdyZXM=
  DB_PASSWORD: YWRtaW4=
  
  # External service tokens (if any)
  EXTERNAL_API_TOKEN: eW91ci1leHRlcm5hbC1hcGktdG9rZW4=
---
# Example of how to create secrets from command line:
# kubectl create secret generic workshop-app-secrets \
#   --from-literal=DATABASE_URL="postgresql://user:password@postgres-service:5432/workshop_db" \
#   --from-literal=JWT_SECRET="my-jwt-secret-key-for-workshop-app" \
#   --from-literal=DB_USER="user" \
#   --from-literal=DB_PASSWORD="password" \
#   --from-literal=EXTERNAL_API_TOKEN="your-external-api-token" \
#   -n workshop-app